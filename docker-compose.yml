services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1
      POSTGRES_DB: f1
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/002_extended.sql:/docker-entrypoint-initdb.d/02_extended.sql:ro
volumes:
  pgdata:
